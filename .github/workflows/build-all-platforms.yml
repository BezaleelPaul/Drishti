name: Drishti Multi-Platform CI/CD Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish artifacts to GitHub Releases"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag to publish (defaults to the latest v* tag)"
        required: false
        default: "v1.10.0"
        type: string

permissions:
  contents: write

concurrency:
  group: drishti-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.50.0

jobs:
  # ---------------------------------------------------------------------------
  # 0. Cross-platform quality gate
  # ---------------------------------------------------------------------------
  quality:
    name: Analyze & Core Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Static Analysis
        working-directory: flutter_app
        # Warnings fail the gate; informational Flutter SDK deprecation hints
        # (the framework's 3.50 material_ui migration) are reported but do
        # not block a clinical build.
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Core Persistence, PDF & Queue Tests
        working-directory: flutter_app
        run: |
          flutter test --no-pub \
            test/local_store_backend_test.dart \
            test/screening_persistence_test.dart \
            test/offline_queue_service_test.dart \
            test/clinical_pdf_generator_test.dart \
            test/quality_gate_test.dart \
            test/deidentify_test.dart \
            test/encrypted_payload_test.dart \
            test/specialist_routing_test.dart \
            test/smtp_service_test.dart \
            test/flow_dark_restyle_test.dart

  # ---------------------------------------------------------------------------
  # 1. Android Release APK
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android Release APK
    needs: quality
    # Fork PRs cannot read repository secrets; the signed Android job is
    # skipped there instead of failing. Internal PRs/tags/main always run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore Android Release Signing Key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Android signing secrets are missing (ANDROID_KEYSTORE_BASE64)."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/drishti-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          cat << EOF > flutter_app/android/key.properties
          storeFile=$KEYSTORE
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Accept Android SDK Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flutter Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Android Release APKs (per ABI)
        working-directory: flutter_app
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Stage Android Release Artifacts
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Drishti_mobile_arm64-v8a_release.apk
          cp flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Drishti_mobile_armeabi-v7a_release.apk
          cp flutter_app/build/app/outputs/flutter-apk/app-x86_64-release.apk Drishti_mobile_x86_64_release.apk

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Drishti_mobile_release
          path: Drishti_mobile_*-release.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Linux Desktop Bundle
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux x86_64 Desktop Bundle
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install Flutter Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Linux Release Bundle
        working-directory: flutter_app
        run: flutter build linux --release

      - name: Package Linux Standalone Tarball
        run: |
          mkdir -p dist/linux
          cp -a flutter_app/build/linux/x64/release/bundle/. dist/linux/
          cat << 'EOF' > dist/linux/run_drishti.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          exec ./drishti "$@"
          EOF
          chmod +x dist/linux/run_drishti.sh
          tar -czvf Drishti_linux_release.tar.gz -C dist/linux .

      - name: Upload Linux Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drishti_linux_release
          path: Drishti_linux_release.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Windows Desktop Executable
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows x86_64 Standalone Executable
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Flutter Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Windows Release Executable
        working-directory: flutter_app
        run: flutter build windows --release

      - name: Package Windows Release Archive
        shell: pwsh
        run: |
          $release = "flutter_app\build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force -Path "dist\windows" | Out-Null
          Copy-Item -Path "$release\*" -Destination "dist\windows" -Recurse -Force
          @"
          @echo off
          cd /d "%~dp0"
          start "" "drishti.exe"
          "@ | Set-Content -Encoding ASCII "dist\windows\run_drishti.bat"
          Compress-Archive -Path "dist\windows\*" -DestinationPath "Drishti_windows_release.zip" -Force

      - name: Upload Windows Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drishti_windows_release
          path: Drishti_windows_release.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. macOS Universal App Bundle
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS Universal App Bundle
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Flutter Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build macOS Release Bundle
        working-directory: flutter_app
        run: flutter build macos --release

      - name: Package macOS Application Archive
        run: |
          APP_PATH=$(find flutter_app/build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "Packaging macOS App from: $APP_PATH"
          mkdir -p dist/macos
          ditto "$APP_PATH" "dist/macos/Drishti.app"
          cat << 'EOF' > dist/macos/run_macos.command
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          xattr -dr com.apple.quarantine Drishti.app 2>/dev/null || true
          open Drishti.app
          EOF
          chmod +x dist/macos/run_macos.command
          ditto -c -k --keepParent dist/macos Drishti_macos_release.zip

      - name: Upload macOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drishti_macos_release
          path: Drishti_macos_release.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 5. iOS Unsigned Application Bundle
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS Unsigned Bundle
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build iOS Release Bundle (Unsigned)
        working-directory: flutter_app
        run: flutter build ios --release --no-codesign

      - name: Package iOS Application Archive
        run: |
          ditto -c -k --keepParent flutter_app/build/ios/iphoneos/Runner.app Drishti_ios_unsigned_release.zip

      - name: Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drishti_ios_unsigned_release
          path: Drishti_ios_unsigned_release.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 6. Automated GitHub Release Attachment
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish Multi-Platform Release Assets
    needs: [build-android, build-linux, build-windows, build-macos, build-ios]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: Drishti_mobile_release

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: Drishti_linux_release

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Drishti_windows_release

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Drishti_macos_release

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Drishti_ios_unsigned_release

      - name: Resolve Tag and Release Notes
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v1.10.0"
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

          NOTES="presentation/RELEASE_NOTES_${TAG_NAME}.md"
          if [[ -f "$NOTES" ]]; then
            cp "$NOTES" release_body.md
          else
            printf 'Automated multi-platform build for Drishti %s.\n' "$TAG_NAME" > release_body.md
          fi

      - name: Version Release Asset Names
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "Drishti_mobile_${abi}_release.apk" "Drishti_mobile_${TAG}_${abi}.apk"
          done
          mv Drishti_linux_release.tar.gz "Drishti_linux_${TAG}.tar.gz"
          mv Drishti_windows_release.zip "Drishti_windows_${TAG}.zip"
          mv Drishti_macos_release.zip "Drishti_macos_${TAG}.zip"
          mv Drishti_ios_unsigned_release.zip "Drishti_ios_unsigned_${TAG}.zip"
          sha256sum Drishti_* > SHA256SUMS.txt
          ls -lh Drishti_* SHA256SUMS.txt

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Drishti ${{ steps.meta.outputs.tag }} — Multi-OS Clinical Release
          body_path: release_body.md
          generate_release_notes: true
          files: |
            Drishti_mobile_v*.apk
            Drishti_linux_v*.tar.gz
            Drishti_windows_v*.zip
            Drishti_macos_v*.zip
            Drishti_ios_unsigned_v*.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
